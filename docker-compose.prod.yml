# Production stack for Dokploy (Create → Compose → this file). Three separate services from one image:
#   api   — token server, behind Traefik on your domain (Dokploy → Domains → service "api", port 3000)
#   agent — LiveKit worker: makes only OUTBOUND connections (LiveKit Cloud, Gemini, Deepgram, Cartesia), no domain/port
#   db    — Postgres + pgvector for long-term memory (persistent volume, never exposed publicly)
# Set the env vars in Dokploy → Environment (see .env.example); never commit them.
services:
  api:
    build: .
    command: ['npm', 'run', 'start:api']
    restart: unless-stopped
    environment: &env
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
      CARTESIA_VOICE_TR: ${CARTESIA_VOICE_TR:-}
      CARTESIA_VOICE_EN: ${CARTESIA_VOICE_EN:-}
      DEMO_API_KEY: ${DEMO_API_KEY}
      DATABASE_URL: postgres://mira:${POSTGRES_PASSWORD}@db:5432/mira
      MAX_SESSIONS_PER_DAY: ${MAX_SESSIONS_PER_DAY:-200}
      MAX_CALL_MINUTES: ${MAX_CALL_MINUTES:-10}
      AWAY_HANGUP_SECONDS: ${AWAY_HANGUP_SECONDS:-60}
      TRUST_PROXY: '1' # behind Traefik: rate limit per real client IP
      PORT: '3000'
    expose: ['3000']
    depends_on: [db]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent:
    build: .
    command: ['npm', 'run', 'start:agent']
    restart: unless-stopped
    environment: *env
    depends_on: [db]

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mira
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
